services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: money-tracker-app

    restart: unless-stopped

    working_dir: /var/www

    # env_file inyecta variables pero no crea el fichero; Laravel (p. ej. key:generate) lee /var/www/.env
    volumes:
      - .:/var/www

    depends_on:
      - postgres

  nginx:
    image: nginx:alpine

    container_name: money-tracker-nginx

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      - app

  postgres:
    image: postgres:16-alpine

    container_name: money-tracker-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: money_tracker
      POSTGRES_USER: money_tracker
      POSTGRES_PASSWORD: secret

    volumes:
      - postgres-data:/var/lib/postgresql/data

    command: postgres -c shared_buffers=128MB

volumes:
  postgres-data:
