# Producción sin montar el código: el artefacto es la imagen. Requiere `.env` en el host (misma carpeta
# que este archivo) para `env_file` y para las variables ${DB_*} de Postgres.
#
# Importante: la imagen `nginx` copia `public/` (incl. `public/build` de Vite) al construirse. Tras cambios de
# frontend o `npm run build`, hay que reconstruir `app` Y `nginx` (o `docker compose ... build` sin filtrar).
# Si solo haces `build app`, el HTML apuntará a hashes nuevos y Nginx seguirá sirviendo assets viejos → 404.
#
# Despliegue típico: git pull → docker compose -f docker-compose.prod.yml build → up -d
# → exec app php artisan migrate --force (y passport:keys / storage:link si aplica).

services:

  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: app

    container_name: money-tracker-app

    restart: unless-stopped

    working_dir: /var/www

    # Variables (APP_KEY, DB_*, etc.): requieren clear_env=no en php-fpm — ver docker/prod/Dockerfile.
    env_file:
      - .env

    volumes:
      - app-storage:/var/www/storage
      - app-bootstrap-cache:/var/www/bootstrap/cache

    depends_on:
      - postgres

  nginx:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: nginx

    container_name: money-tracker-nginx

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Certificados emitidos en el host (certbot). Primera vez: ver comentario al final de este archivo.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot para renovación: certbot --webroot -w ./docker/certbot/www
      - ./docker/certbot/www:/var/www/certbot:ro

    depends_on:
      - app

  # Las credenciales deben coincidir con DB_* en .env (Compose inyecta .env de la raíz al interpretar ${...}).
  # Nota: POSTGRES_* solo aplica en el primer arranque del volumen; si ya existe postgres-data, cambiar la
  # contraseña requiere ALTER USER en Postgres o recrear el volumen (pérdida de datos).
  postgres:
    image: postgres:16-alpine

    container_name: money-tracker-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE:-money_tracker}
      POSTGRES_USER: ${DB_USERNAME:-money_tracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    command: postgres -c shared_buffers=128MB

volumes:
  postgres-data:
  app-storage:
  app-bootstrap-cache:

# --- HTTPS (Let's Encrypt en la VPS) ---
# 1) En el host: sudo apt install certbot
# 2) Primera emisión con Nginx detenido (libera el 80): docker compose -f docker-compose.prod.yml stop nginx
#    sudo certbot certonly --standalone -d tu-dominio.com
# 3) Ajusta server_name y rutas live/tu-dominio en docker/nginx/default.conf; rebuild nginx:
#    docker compose -f docker-compose.prod.yml build nginx && docker compose -f docker-compose.prod.yml up -d
# 4) En .env: APP_URL=https://tu-dominio.com
# Renovación con stack en marcha: sudo certbot renew --webroot -w /ruta/al/proyecto/docker/certbot/www
#    (los challenges deben escribirse en docker/certbot/www; luego docker compose exec nginx nginx -s reload)
