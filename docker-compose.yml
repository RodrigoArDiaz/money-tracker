services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      # Puertos por defecto 1026/8026 para no chocar con otro Mailpit en 1025/8025 del host
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
      - "${MAILPIT_UI_PORT:-8026}:8025"

  postgres:
    image: postgres:16-alpine
    container_name: money-tracker-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-money_tracker}
      POSTGRES_USER: ${DB_USERNAME:-money_tracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Puerto del host: por defecto 5433 para no chocar con Postgres instalado en la máquina (5432).
    ports:
      - "${DB_PORT_HOST:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-money_tracker} -d ${DB_DATABASE:-money_tracker}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # pgAdmin 4 — http://localhost:PGADMIN_PORT (login con PGADMIN_DEFAULT_*). Añadir servidor: Host postgres, Puerto 5432.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: money-tracker-pgadmin
    depends_on:
      postgres:
        condition: service_started
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money-tracker-app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    environment:
      APP_URL: "${APP_URL:-http://localhost:8000}"
      INERTIA_SSR_ENABLED: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-money_tracker}
      DB_USERNAME: ${DB_USERNAME:-money_tracker}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"

volumes:
  postgres-data:
  pgadmin-data:
