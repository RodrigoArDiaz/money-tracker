# HTTPS con Let's Encrypt en el host (/etc/letsencrypt).
# Sustituir "money-tracker.diazrodrigoar.dev" por tu dominio en server_name y en las rutas ssl_certificate*.

# --- Puerto 80: ACME (renovaciones) y redirección a HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name money-tracker.diazrodrigoar.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Puerto 443: aplicación ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name money-tracker.diazrodrigoar.dev;

    ssl_certificate     /etc/letsencrypt/live/money-tracker.diazrodrigoar.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/money-tracker.diazrodrigoar.dev/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/public;
    index index.php index.html;

    client_max_body_size 20M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;

        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
